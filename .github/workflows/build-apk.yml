name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Regenerate Android project (known-good Gradle files)
        run: |
          rm -rf android
          flutter create --platforms=android --org com.otomater --project-name otm_b2b_field_app .
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in [
              'INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'CALL_PHONE',
              'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK'])
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('android:label="otm_b2b_field_app"', 'android:label="Otomater B2B Field"')
          open(p, 'w').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: otm-b2b-field-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
